# nginx config INSIDE the container. TLS stays on the host nginx.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Angular routing: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output is content-hashed (main-ABC123.js), so it can be cached forever
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise visitors won't see new deployments
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
